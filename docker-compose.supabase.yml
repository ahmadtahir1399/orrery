# Hosted Postgres (Supabase) instead of the bundled database container.
#
# Set DATABASE_URL (transaction pooler, port 6543) and DATABASE_MIGRATION_URL
# (session pooler, port 5432), both ending in ?sslmode=require, then run
#   docker compose -f docker-compose.yml -f docker-compose.supabase.yml up -d
# or put COMPOSE_FILE=docker-compose.yml:docker-compose.supabase.yml in .env so
# a plain `docker compose up -d` includes this file.
#
# POSTGRES_PASSWORD must still be set because the base file validates it.
services:
  postgres:
    # Kept stopped; the app talks to Supabase.
    profiles: ['bundled-db']

  web:
    depends_on: !override
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be the Supabase transaction pooler URL (port 6543)}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL must be the Supabase session pooler URL (port 5432)}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
